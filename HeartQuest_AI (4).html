<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>HeartQuest AI</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fffaf6;--card:#fff;--ink:#14263f;--mut:#5d6b80;--co:#ef5b5b;--coS:#ffe5e3;--te:#12a3a3;--teS:#dff5f4;--gr:#2fb36d;--grS:#e0f6e9;--go:#f5b82e;--goS:#fff2cf;--ln:#efe6df;color-scheme:light}:root[data-theme=dark]{--bg:#0e1a2b;--card:#16263d;--ink:#e8eef7;--mut:#a3b3c8;--ln:#2a3d57;--coS:#4a2530;--teS:#14403f;--grS:#17402b;--goS:#4a3c14;color-scheme:dark}input,select,textarea{background:var(--card);color:var(--ink)}.gh{background:var(--card)!important}.nav{background:var(--card)!important}.day{background:var(--ln)}.bar{background:var(--ln)}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:600 16px/1.45 Nunito,system-ui,sans-serif;color:var(--ink);background:var(--bg);padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
h1,h2,h3{font-family:Fredoka,sans-serif;margin:0;font-weight:600;line-height:1.15}
button{font:inherit;font-weight:800;cursor:pointer;border:0;border-radius:14px;padding:12px 18px;min-height:44px;background:var(--teS);color:#0b6e6e}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--te);outline-offset:2px}
.pri{background:var(--co);color:#fff;box-shadow:0 4px 0 #c43f3f}.pri:active{transform:translateY(3px);box-shadow:none}
button[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}.gh{background:#fff;border:2px solid var(--ln);color:var(--ink)}
.wrap{max-width:560px;margin:auto;padding:16px 16px 96px}.dw{max-width:1040px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 6px 18px rgba(20,38,63,.06)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}.grow{flex:1}
.bar{height:14px;border-radius:9px;background:#eee5de;overflow:hidden}.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--co),var(--go));transition:width .8s}
.pill{display:inline-block;border-radius:99px;padding:3px 11px;font-size:13px;font-weight:800}
.mut{color:var(--mut);font-size:14px}.nav{position:fixed;left:0;right:0;bottom:0;background:#fffe;border-top:1px solid var(--ln);display:flex;justify-content:center;gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0));backdrop-filter:blur(8px);z-index:5}
.nav button{background:none;color:var(--mut);flex:1;max-width:96px;padding:6px 2px;font-size:12px;border-radius:12px}.nav button b{display:block;font-size:20px}.nav .on{background:var(--coS);color:var(--co)}
.top{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.top button{background:#fff;border:2px solid var(--ln);color:var(--ink)}.top .on{background:var(--te);color:#fff;border-color:var(--te)}
.q{display:flex;gap:12px;align-items:center}.q .ic{font-size:30px;width:54px;height:54px;border-radius:16px;background:var(--goS);display:grid;place-items:center}.q.done{opacity:.65}.q.dr .ic{background:var(--teS)}
.day{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#f3ece6;font-weight:800}.day.on{background:var(--go);box-shadow:0 0 12px var(--go)}
.shap{display:grid;grid-template-columns:110px 1fr 44px;gap:8px;align-items:center;margin:7px 0}.shap .b{height:16px;border-radius:8px;background:#f3ece6;position:relative;overflow:hidden}.shap .b i{position:absolute;top:0;bottom:0;transition:width .7s}
.ring{--p:0;width:120px;height:120px;border-radius:50%;background:conic-gradient(var(--te) calc(var(--p)*1%),#eee5de 0);display:grid;place-items:center;transition:.8s}.ring div{width:92px;height:92px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center;font:600 30px Fredoka}
.ok{background:var(--grS);color:#1a7a48}.warn{background:var(--goS);color:#8a5b00}
.hero{text-align:center;padding:28px 8px}.hero h1{font-size:clamp(32px,8vw,52px)}.flow{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:18px 0}.flow span{background:#fff;border:2px solid var(--ln);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:800}.flow span:nth-child(n+4){border-color:var(--te);color:#0b6e6e}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:16px;z-index:20;max-width:92vw;animation:in .3s}
@keyframes in{from{opacity:0;transform:translate(-50%,-14px)}}
@keyframes pulse{50%{transform:scale(1.07)}}.beat{animation:pulse 1.1s infinite;transform-origin:center}
@keyframes fly{to{transform:translate(var(--x),-260px) rotate(360deg);opacity:0}}.cf{position:fixed;bottom:40%;left:50%;font-size:26px;animation:fly 1.4s forwards;z-index:30;pointer-events:none}
.sw{position:relative;width:52px;height:30px;flex:none}.sw input{opacity:0;position:absolute;inset:0;margin:0;cursor:pointer;z-index:2;width:100%;height:100%}.sw i{position:absolute;inset:0;border-radius:99px;background:#d9d0c8;transition:.2s}.sw i:after{content:"";position:absolute;width:24px;height:24px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s}.sw input:checked+i{background:var(--te)}.sw input:checked+i:after{left:25px}
.modal{position:fixed;inset:0;background:#14263f88;display:grid;place-items:center;z-index:25;padding:16px}.modal .card{max-width:440px;margin:0}
table{width:100%;border-collapse:collapse}td,th{padding:10px 8px;text-align:left;border-bottom:1px solid var(--ln)}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.stat{font:600 34px Fredoka}
input[type=range]{width:100%;accent-color:var(--co)}select,input[type=text]{font:inherit;padding:10px;border-radius:12px;border:2px solid var(--ln);min-height:44px}
.foot{font-size:12px;color:var(--mut);text-align:center;margin-top:18px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* v2 additions: dark-mode fixes, 7-day chart */
:root[data-theme=dark] .ring div{background:var(--card)}
:root[data-theme=dark] .bar,:root[data-theme=dark] .shap .b,:root[data-theme=dark] .day:not(.on){background:var(--ln)}
:root[data-theme=dark] .top button:not(.on),:root[data-theme=dark] .flow span{background:var(--card)}
:root[data-theme=dark] .ok{color:#7be0a8}:root[data-theme=dark] .warn{color:#f5d27a}
:root[data-theme=dark] .wrap button:not(.pri):not(.gh):not(.on),:root[data-theme=dark] .modal button:not(.pri):not(.gh){color:#8ff0f0}
.wk{display:flex;gap:6px;align-items:flex-end;min-height:110px;text-align:center}.wk div{flex:1;font-size:12px}.wk i{display:block;border-radius:6px 6px 0 0;background:linear-gradient(var(--co),var(--go))}
@media(max-width:430px){.nav{gap:0;padding-left:2px;padding-right:2px}.nav button{font-size:10.5px;padding:6px 0;min-width:0;overflow:hidden;text-overflow:clip}.nav button b{font-size:18px}}
</style></head><body><div id="app"></div><div id="ov"></div>
<script>
const $=s=>document.querySelector(s),LV=['Heart Explorer','Healthy Habit Builder','Cardio Champion','Heart Guardian','HeartQuest Master'],LI=['🧭','🌱','🏃','🛡️','👑'],LVX=[0,100,250,450,700],STG=['Heart Village','Fitness Trail','Nutrition Garden','Calm Valley','Guardian Arena'];
const S={role:null,tab:'home',dt:'ov',xp:0,coins:0,lives:3,pts:0,ts:50,sd:0,user:'',pt:[0],hist:[],V:[],rec:[],notes:[],code:'',conn:'none',pname:'',av:{skin:1,hair:0,style:0},inv:[],name:'',lg:0,walk:null,food:[],foodRw:'',prefs:{theme:'light',sound:true,remind:false,rtime:'09:00',water:8,walk:30,week:150,demo:true},water:{d:'',n:0},checkins:[],tut:0,wkd:'',wkClaim:'',skip:{d:'',ids:[]},bio:{},streak:0,week:0,priv:false,lessons:0,sel:'alex',odd:false,dlog:{},learned:[],dq:[],lastAct:'',lvd:'',detd:'',dset:{ad:60,idle:3},bk:[],
 cons:{pers:true,model:false,res:false,rem:true},
 P:{hr:null,a1c:null,age:null,act:null,bmi:null,bp:null},
 Q:[{id:'walk',ic:'🚶',t:'Take a walk',xp:50,c:100,d:0},{id:'water',ic:'💧',t:'Record your water intake',xp:20,c:10,d:0},{id:'meal',ic:'🥗',t:'Scan and review a meal',xp:25,c:50,d:0},{id:'learn',ic:'🧠',t:'Health-education activity',xp:20,c:10,d:0},{id:'checkin',ic:'📝',t:'Wellness check-in',xp:15,c:10,d:0},{id:'calm',ic:'🧘',t:'5-minute calm break',xp:20,c:15,d:0}],
 trend:[],log:[]};
const OTH=[{id:'maya',n:'Maya Rao',r:'Low',tr:88,ad:92,st:14,lc:'Today'},{id:'sam',n:'Sam Iyer',r:'High',tr:74,ad:41,st:0,lc:'4 days ago'},{id:'lena',n:'Lena Park',r:'Moderate',tr:90,ad:76,st:5,lc:'Yesterday'}];
const lvNeed=l=>l>=5?Infinity:LVX[l];let lvl=1;
const toast=m=>{const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2600)};
const conf=()=>{for(let i=0;i<14;i++){const e=document.createElement('div');e.className='cf';e.textContent=['🎉','❤️','🪙','✨'][i%4];e.style.setProperty('--x',(Math.random()*300-150)+'px');e.style.marginLeft=(Math.random()*120-60)+'px';document.body.append(e);setTimeout(()=>e.remove(),1500)}};
function model(p,odd){const F={'Heart rate':p.hr!=null&&(p.hr-72)*.9,'HbA1c':p.a1c!=null&&(p.a1c-5.7)*9,'Activity':p.act!=null&&(odd?1:-1)*(p.act-20)*.5,'Age':p.age!=null&&(p.age-45)*.7,'BMI':p.bmi!=null&&(p.bmi-24)*1.2},c={};for(const k in F)if(F[k]!==false)c[k]=F[k];const n=Object.keys(c).length;if(n<3)return{c,s:null,cat:'Insufficient data',n};const s=Math.max(5,Math.min(95,20+Object.values(c).reduce((a,b)=>a+b,0)));return{c,s,cat:s<40?'Low':s<55?'Moderate':s<70?'Elevated':'High',n}}
const EXP={'Heart rate':1,'HbA1c':1,'Activity':-1,'Age':1,'BMI':1};
function trust(p,odd){const m=model(p,odd),n=Object.keys(m.c),pass=n.filter(k=>Math.abs(m.c[k])<1||Math.sign(m.c[k])===EXP[k]).length,pl=n.length?Math.round(pass/n.length*100):0,dc=Math.round(Object.values(p).filter(v=>v!=null).length/6*100),sg=92,ex=pl,mc=80;return{m,pass,pl,dc,sg,ex,mc,t:Math.round((dc+sg+ex+pl+mc)/5),bad:n.filter(k=>!(Math.abs(m.c[k])<1||Math.sign(m.c[k])===EXP[k]))}}
function gain(xp,c,why){beep(660);S.xp+=xp;S.pts+=xp;dlGet().xp+=xp;S.coins+=c;toast(`+${xp} XP · +${c} HeartCoins — ${why}`);conf();let up=0;while(S.xp>=lvNeed(lvl)){lvl++;up=lvl}if(up)setTimeout(()=>lvUp(up),600)}
function done(id){const q=S.Q.find(x=>x.id==id);if(!q||q.d)return;q.d=1;{const L=dlGet();L.q++;if(id=='walk'){L.w+=S.prefs.walk;L.ws=S.walkSrc||'sensor'}}if(id=='walk'){S.week+=S.prefs.walk;S.P.act=S.prefs.walk;{const q=model(S.P,0).s;if(q!=null)S.trend.push(Math.round(q))}}if(q.dr){S.week+=0}
 bump();gain(q.xp,q.c,q.t);if(S.week>=S.prefs.week&&S.wkGoal!==wkId()){S.wkGoal=wkId();gain(60,40,'Weekly movement goal reached!')}R()}
const badges=()=>[['🏃','First Walk',S.Q[0].d],['🔥','7-Day Streak',S.streak>=7],['❤️','Heart Guardian',lvl>=4],['🎯','Goal Crusher',S.week>=S.prefs.week||S.wkGoal===wkId()],['🩺','Doctor Quest Complete',S.Q.some(q=>q.dr&&q.d)],['🧠','Heart Health Scholar',S.lessons>0],['🏆','30-Day Champion',S.streak>=30]];
const pulse=(s=90)=>`<svg width="${s}" height="${s}" viewBox="0 0 100 100" aria-label="Pulse the heart mascot" role="img"><g class="beat"><path d="M50 88C20 66 8 48 8 31 8 18 18 9 30 9c8 0 15 4 20 11 5-7 12-11 20-11 12 0 22 9 22 22 0 17-12 35-42 57z" fill="#ef5b5b"/><path d="M18 40h18l6-12 10 24 6-12h24" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="36" cy="24" r="3" fill="#fff"/><path d="M80 12l2 5 5 2-5 2-2 5-2-5-5-2 5-2z" fill="#f5b82e"/></g></svg>`;
const logo=pulse(46);
function R(){rollover();syncConn();applyTheme();sv();if(cam&&!$('#cv'))stopCam();if(S.role=='p'&&S.name&&!S.tut&&!tutOpen){tutOpen=1;setTimeout(tutShow,400)}const a=$('#app');a.innerHTML=!S.role?landing():!S.name?nameScreen():S.role=='p'?patient():doctor();if(S.role=='p'&&S.tab=='heart')wi()}
function landing(){const ft='<p class="foot">HeartQuest AI is a health-support and educational prototype. AI-generated insights are not medical diagnoses or a substitute for professional medical advice.</p>';
if(!S.lg)return`<div class="wrap hero" style="padding-top:8vh">${pulse(130)}<h1 style="letter-spacing:.02em">HEART<span style="color:var(--co)">QUEST</span> AI</h1><p style="font-size:20px;margin:10px 0 22px">Challenge AI. Understand Your Heart. Make Better Decisions.</p><button class="pri" style="font-size:20px;padding:16px 36px" onclick="S.lg=1;rl='p';R()">▶ PLAY NOW</button><div class="row" style="justify-content:center;margin-top:14px"><button class="gh" onclick="S.lg=1;rl='p';R()">Patient login</button><button class="gh" onclick="S.lg=1;rl='d';am='in';R()">Doctor login</button></div><div style="margin-top:26px;font-size:42px" aria-hidden="true">🧑 🩺 🤖 ❤️</div>${ft}</div>`;
return`<div class="wrap hero">${pulse(80)}<h2>HEARTQUEST AI</h2><br>${loginForm()}<button class="gh" onclick="S.lg=0;R()">← Back</button>${ft}</div>`}
const nameScreen=()=>`<div class="wrap hero">${pulse(90)}<h2>Welcome to HeartQuest AI!</h2><p style="font-size:18px">Before we begin, what should we call you?</p><p class="mut">We'll use this name in your game${S.role=='d'?' and with your patients':' and with your doctor'}.</p><label><span style="position:absolute;left:-9999px">Preferred name</span><input type="text" id="nm" maxlength="30" placeholder="Your name" style="${ib}"></label><p id="ne" role="alert" style="color:#b23b3b;min-height:1.4em"></p><button class="pri" onclick="saveName()">Continue</button></div>`;
function saveName(){const v=$('#nm').value.replace(/[<>&"]/g,'').trim();if(!v){set('ne','Please enter your preferred name (spaces alone are not valid).');return}S.name=v.slice(0,30);toast('Welcome, '+S.name+'!');R()}
function patient(){const T=[['home','🏠','Home'],['heart','❤️','Health'],['measure','📷','Measure'],['book','🧪','Tests'],['play','🎮','Play'],['dochub','🩺','Doctor'],['board','🏆','Ranks'],['privacy','👤','Profile']];
const n=S.Q.filter(q=>q.dr&&!q.d).length;
return`<div class="wrap"><div class="row sp"><div class="row">${logo}<b style="font:600 20px Fredoka">HeartQuest</b></div><div class="row"><button class="gh" onclick="sos()" style="color:#b23b3b">Need urgent help?</button><button class="gh" onclick="logout()">Exit</button></div></div><div style="height:12px"></div>${{home,quests,heart,journey,rewards,privacy,personal,dochub,play,board,measure,food,book:bookTab}[S.tab]()}<p class="foot">HeartQuest AI is an educational prototype; insights are not medical diagnoses.</p></div>
<nav class="nav" aria-label="Main">${T.map(t=>`<button class="${S.tab==t[0]?'on':''}" onclick="S.tab='${t[0]}';R();scrollTo(0,0)" aria-label="${t[2]}"><b>${t[1]}${t[0]=='home'&&n?'<span class="pill" style="background:var(--co);color:#fff;font-size:10px">'+n+'</span>':''}</b>${t[2]}</button>`).join('')}</nav>`}



function det(i){if(S.detD)return toast('Already played today');if(i==1){S.detD=1;S.detd=td0();toast('Correct! Context matters: rest, stress, caffeine and illness all change heart rate. Follow guidance and seek care for symptoms.');S.lessons++;bump();const lq=S.Q.find(q=>q.id=='learn');if(lq&&!lq.d)done('learn');else gain(10,5,'Heart Detective')}else toast('Not quite — check the context and follow guidance. Intense exercise or ignoring it are not safe defaults. Try again!');R()}
const dq=k=>({good:'Good',avail:'Available',miss:'Missing'}[k]);
function heart(){const T=trust(S.P,S.odd),m=T.m,P=S.P;if(m.s==null)return`<h2 style="margin-bottom:12px">❤️ My Health</h2><div class="card"><h3>Not enough data for an AI insight</h3><p>The model needs at least 3 of: heart rate, HbA1c, age, BMI, activity. We never fill in missing values.</p><p class="mut">Missing: ${['hr','a1c','age','bmi','act'].filter(k=>P[k]==null).join(', ')}</p><button class="pri" onclick="S.tab='measure';R()">Go to Measure</button></div>`;
const dqRows=[['❤️ Heart rate',P.hr!=null?P.hr+' bpm':'Missing',P.hr!=null],['🩸 HbA1c',P.a1c!=null?P.a1c+'%':'Missing',P.a1c!=null],['🏃 Activity',P.act!=null?P.act+' min/day':'Missing',P.act!=null],['Age / BMI',P.age!=null&&P.bmi!=null?'Available':'Missing',P.age!=null&&P.bmi!=null],['Blood pressure',P.bp||'Missing',!!P.bp]];
const mx=Math.max(...Object.values(m.c).map(Math.abs));
return`<h2 style="margin-bottom:12px">My Heart ❤️</h2>
<div class="card"><h3>Data quality</h3>${dqRows.map(r=>`<div class="row sp"><span>${r[0]}</span><span class="pill ${r[2]?'ok':'warn'}">${r[2]?'✓':'!'} ${r[1]}</span></div>`).join('')}<p class="mut">Your result may be less reliable because some information is unavailable. We never fill in missing values.</p></div>
<div class="card"><h3>AI-Assisted Risk Insight</h3><div class="row" style="margin:8px 0"><span class="pill ${m.cat=='Low'?'ok':'warn'}" style="font-size:18px">Current risk category: ${m.cat}</span><span class="mut">model score ${Math.round(m.s)}/100</span></div><p class="mut">This is an AI-generated risk assessment and is not a diagnosis.</p><button onclick="why()">Why am I seeing this?</button></div>
<div class="card"><h3>Why did the AI reach this result?</h3>${Object.entries(m.c).map(([k,v])=>`<div class="shap"><span>${k}</span><div class="b"><i style="${v>=0?'left':'right'}:50%;width:${Math.abs(v)/mx*50}%;background:${v>=0?'var(--co)':'var(--gr)'}"></i></div><b>${v>=0?'+':'−'}${Math.abs(v).toFixed(0)}</b></div>`).join('')}<p class="mut">Red pushes the model score up; green pushes it down. This explanation shows how the model weighted inputs; it does not prove medical causation. Prototype: rule-based SHAP-style demonstration, not a trained model.</p></div>
<div class="card"><h3>🩺 Clinical Plausibility Check</h3>${Object.keys(m.c).map(k=>{const bad=T.bad.includes(k);return`<div class="row sp"><span>${k} → ${m.c[k]>=0?'raises':'lowers'} risk</span><span class="pill ${bad?'warn':'ok'}">${bad?'⚠ Unexpected':'✓ Plausible'}</span></div>`}).join('')}<div class="card ${T.bad.length?'warn':'ok'}" style="margin:10px 0 0;box-shadow:none"><b>${T.bad.length?'⚠️ Potential reasoning mismatch detected':'✅ Plausibility check passed'}</b><br>${T.bad.length?'This does not mean the model is definitely wrong. It means the reasoning should be reviewed by your doctor.':'Each factor moves risk in the direction expected from clinical knowledge (prototype rules).'}</div></div>
<div class="card"><h3>❤️ Trust Score</h3><div class="row"><div class="ring" style="--p:${T.t}"><div>${T.t}</div></div><div class="grow">${[['Data completeness',T.dc],['Signal quality',T.sg],['Explanation consistency',T.ex],['Clinical plausibility',T.pl],['Model confidence',T.mc]].map(r=>`<div class="row sp mut"><span>${r[0]}</span><b>${r[1]}</b></div>`).join('')}</div></div><p class="mut">${T.t}/100 — prototype trust indicator based on data quality and explanation checks. Not medical accuracy.</p></div>
<div class="card"><h3>What if? 🔮</h3><p class="mut">Model simulation, not a guarantee of health outcomes.</p>
${[['hr','Resting heart rate (bpm)',60,110,1],['a1c','HbA1c (%)',5,10,.1],['act','Activity (min/day)',0,90,5]].filter(s=>P[s[0]]!=null).map(s=>`<label>${s[1]}: <b id="v_${s[0]}"></b><input type="range" id="w_${s[0]}" min="${s[2]}" max="${s[3]}" step="${s[4]}" value="${P[s[0]]}" oninput="wi()"></label>`).join('')}<div id="wo" class="card ok" style="margin:10px 0 0;box-shadow:none"></div>
<label class="row" style="margin-top:12px"><span class="sw"><input type="checkbox" ${S.odd?'checked':''} onchange="S.odd=this.checked;R()"><i></i></span><span>Test: simulate a model with odd reasoning (to see the plausibility layer react)</span></label></div>

function sha256js(s){const m=[...new TextEncoder().encode(s)],pr=[];for(let n=2;pr.length<64;n++)if(pr.every(p=>n%p))pr.push(n);

  [a,b,c,d,e,f,g,h].forEach((v,i)=>H[i]=(H[i]+v)>>>0)}
 return H.map(x=>x.toString(16).padStart(8,'0')).join('')}

{id:'bp',ic:'🩺',t:'Know your blood pressure',tx:`Blood pressure is the force of blood pushing on your artery walls. It is written as two numbers, like 120/80 mmHg: the top number (systolic) is the pressure when your heart beats, the bottom (diastolic) is the pressure between beats. High blood pressure usually causes no symptoms, so measuring is the only way to know. Many guidelines treat readings that stay at 130/80 or higher (some use 140/90) as a reason to talk to a doctor.`,q:'One home reading is higher than usual. What is a sensible next step?',o:['Ignore blood pressure from now on','Rest 5 minutes, re-check while seated, and share a pattern of readings with your doctor','Double any medicine you take'],a:1,h:'Think about calm re-checking and sharing the pattern with a doctor.',e:'Single readings change with stress, caffeine and activity. A pattern of readings, shared with your doctor, is what guides decisions. Never change medicine on your own.'},
{id:'move',ic:'🚶',t:'Move for your heart',tx:`Regular movement strengthens your heart and helps control blood pressure, blood sugar and weight. The World Health Organization advises adults to aim for at least 150 minutes of moderate activity a week, such as brisk walking, and says some activity is better than none. If you have a heart condition or symptoms, ask your doctor what is safe for you first.`,q:'About how many minutes of moderate activity per week do WHO guidelines suggest as a minimum target for adults?',o:['30 minutes','150 minutes','600 minutes'],a:1,h:'Think 30 minutes on five days.',e:'150 minutes a week (for example 30 minutes on 5 days) is the usual minimum target. Your weekly movement goal in HeartQuest starts at 150.'},
{id:'salt',ic:'🧂',t:'Salt and your plate',tx:`Too much sodium, mostly from salt, can raise blood pressure. The WHO recommends adults eat less than 5 g of salt a day, which is under 2,000 mg of sodium. A lot of it hides in pickles, papad, packaged snacks, instant noodles and sauces, not only in the salt shaker.`,q:'What is the WHO suggested daily limit for sodium?',o:['Under 500 mg','Under 2,000 mg','Under 6,000 mg'],a:1,h:'It equals under 5 g of salt.',e:'Under 2,000 mg of sodium a day, which equals under 5 g of salt.'},
{id:'calm',ic:'🧘',t:'Stress, sleep and your heart',tx:`Long-term stress and poor sleep are linked with higher blood pressure and unhealthy habits. Most adults do best with 7 to 9 hours of sleep. Slow breathing, walking outside, talking with someone you trust and a steady bedtime all help.`,q:'Which is a heart-friendly way to handle stress?',o:['Smoking to relax','Regular walks, slow breathing and enough sleep','Skipping meals to save time'],a:1,h:'Pick the habit that helps the heart, not harms it.',e:'Walking, slow breathing and regular sleep lower stress without adding risk. Smoking and skipped meals do the opposite.'},
{id:'tobacco',ic:'🚭',t:'Tobacco and your heart',tx:`Tobacco in any form (cigarettes, bidis, chewing tobacco) damages blood vessels and raises the risk of heart attack and stroke. The good news is that heart risk starts falling after you quit, even after many years of use. Support from a doctor or a quit-line makes quitting more likely to work.`,q:'What is true about quitting tobacco?',o:['Heart risk starts falling after quitting, even for long-term users','There is no benefit after many years of use','Only cigarettes harm the heart, not other tobacco'],a:0,h:'Quitting helps at any stage.',e:'Risk begins to fall after quitting and keeps improving over the following years. All forms of tobacco harm the heart.'},
{id:'signs',ic:'🚨',t:'Warning signs: when to get urgent help',tx:`Chest pain or pressure, pain spreading to the arm, jaw or back, shortness of breath, cold sweat, or sudden dizziness or fainting can be signs of a heart attack. Do not wait for it to pass and do not drive yourself. Call your local emergency number straight away (112 in India). This app cannot diagnose an emergency.`,q:'You or someone near you has chest pressure with sweating and breathlessness. What should you do?',o:['Wait an hour to see if it passes','Call emergency services right away (112 in India)','Go for a long walk to loosen up'],a:1,h:'Time matters in a possible heart attack.',e:'Call emergency services immediately. Fast treatment saves heart muscle and lives.'}];

<div class="card"><div class="row sp"><h3>🎯 Daily quests ${qd}/${S.Q.length}</h3><button class="pri" onclick="S.tab='quests';R()">Open quests</button></div><div class="bar" style="margin-top:8px"><i style="width:${qd/S.Q.length*100}%"></i></div></div>
<div class="g3"><button class="card" style="text-align:left" onclick="S.tab='food';R()"><h3>🍽 Scan a meal</h3><span class="mut">Analyse with AI</span></button><button class="card" style="text-align:left" onclick="S.tab='measure';R()"><h3>❤️ Add a reading</h3><span class="mut">BP, temperature, SpO₂</span></button><button class="card" style="text-align:left" onclick="S.tab='journey';R()"><h3>🗺️ Adventure map</h3><span class="mut">Stages and levels</span></button><button class="card" style="text-align:left;border:2px solid var(--te)" onclick="S.tab='book';R()"><h3>🧪 Book medical tests</h3><span class="mut">Find labs near you</span></button></div>
<div class="card"><h3>This week</h3><div class="bar" style="margin:8px 0"><i style="width:${Math.min(100,S.week/S.prefs.week*100)}%"></i></div><div class="row sp"><b>${S.week} / ${S.prefs.week} min movement</b><span>🔥 ${S.streak}-day streak · ${hearts()}</span></div></div>
<div class="card"><h3>Recent achievements</h3><div class="row">${b.length?b.map(x=>`<span class="pill ok">${x[0]} ${x[1]}</span>`).join(''):'<span class="mut">Finish your first quest to earn a badge.</span>'}</div><h3 style="margin-top:12px">Recent meals</h3>${ml.map(m=>`<div class="row sp"><span>${escB(m.type)}: ${m.items.map(i=>escB(i.n)).join(', ')}</span><b>${m.kcal==null?'—':m.kcal+' kcal'}</b></div>`).join('')||'<p class="mut">No meals saved yet.</p>'}</div>${xpGuide()}`}
function setPref(k,v){S.prefs[k]=v;sv();toast('Saved.');R()}
const selO=(a,v)=>a.map(x=>`<option ${x==v?'selected':''}>${x}</option>`).join('');
function settingsCard(){const p=S.prefs,B=S.bio||{};return`<h2 style="margin-bottom:12px">⚙️ Settings</h2>
<div class="card"><h3>Profile</h3><div class="row"><label>Display name<br><input type="text" id="sn" value="${attr(S.name)}" maxlength="30" style="${ib}"></label><label>Age<br><input type="number" id="sa" min="1" max="120" value="${S.P.age??''}" style="width:90px;${ib}"></label><label>Height (cm)<br><input type="number" id="sh" min="50" max="250" value="${B.h??''}" style="width:100px;${ib}"></label><label>Weight (kg)<br><input type="number" id="sw" min="20" max="400" value="${B.w??''}" style="width:100px;${ib}"></label><label>HbA1c % (optional)<br><input type="number" step="0.1" id="sg" min="3" max="20" value="${S.P.a1c??''}" style="width:100px;${ib}"></label></div><p id="spf" role="alert" style="color:#b23b3b;min-height:1.2em"></p><button class="pri" onclick="saveProfile()">Save profile</button><p class="mut">BMI is worked out from height and weight${S.P.bmi?' (now '+S.P.bmi+')':''}. These numbers feed the AI risk insight only.</p></div>
<div class="card"><h3>Appearance and sound</h3><div class="row"><button class="${p.theme=='light'?'pri':'gh'}" onclick="setPref('theme','light')">☀️ Light</button><button class="${p.theme=='dark'?'pri':'gh'}" onclick="setPref('theme','dark')">🌙 Dark</button></div><label class="row" style="margin-top:8px"><input type="checkbox" ${p.sound?'checked':''} onchange="setPref('sound',this.checked)"> Sound effects (quest and level-up chimes)</label><p class="mut">Avatar: <button class="gh" onclick="S.tab='rewards';R()">Change in Rewards</button></p></div>
<div class="card"><h3>Daily goals</h3><div class="row"><label>Walking (min/day)<br><select onchange="setPref('walk',+this.value)">${selO([10,15,20,30,45],p.walk)}</select></label><label>Water (glasses/day)<br><select onchange="setPref('water',+this.value)">${selO([4,6,8,10],p.water)}</select></label><label>Weekly movement (min)<br><select onchange="setPref('week',+this.value)">${selO([75,100,150,200],p.week)}</select></label></div><p class="mut">Choose goals that suit you and your doctor's advice. Quests and progress bars update straight away.</p></div>
<div class="card"><h3>Reminders</h3><label class="row"><input type="checkbox" ${p.remind?'checked':''} onchange="setRemind(this.checked)"> Daily quest reminder at <input type="time" value="${p.rtime}" onchange="setPref('rtime',this.value)" aria-label="Reminder time"></label><p class="mut">Shown as a browser notification only while HeartQuest is open in a tab (no background push). ${typeof Notification!='undefined'?'Permission: '+Notification.permission+'.':'Notifications are not supported in this browser.'}</p></div>
<div class="card"><h3>Help and data</h3><div class="row"><button onclick="tutShow()">Replay the tutorial</button><button class="gh" onclick="delData()">Delete my readings, meals and check-ins</button><button class="gh" onclick="logoutC()">Log out</button></div></div>`}
function saveProfile(){const n=$('#sn').value.replace(/[<>&"]/g,'').trim(),g=i=>{const v=$('#'+i).value;return v===''?null:+v},a=g('sa'),h=g('sh'),w=g('sw'),c=g('sg'),er=m=>set('spf',m);
 if(!n)return er('Name cannot be empty.');if(a!=null&&!(a>=1&&a<=120))return er('Age must be 1 to 120.');if(h!=null&&!(h>=50&&h<=250))return er('Height must be 50 to 250 cm.');if(w!=null&&!(w>=20&&w<=400))return er('Weight must be 20 to 400 kg.');if(c!=null&&!(c>=3&&c<=20))return er('HbA1c must be 3 to 20 %.');
 S.name=n.slice(0,30);S.P.age=a;S.P.a1c=c;S.bio={h,w};S.P.bmi=h&&w?Math.round(w/((h/100)**2)*10)/10:null;toast('Profile saved.');R()}
function setRemind(on){if(!on){setPref('remind',false);return}if(typeof Notification=='undefined'){toast('Notifications are not supported in this browser.');return R()}Notification.requestPermission().then(r=>{S.prefs.remind=r=='granted';if(r!='granted')toast('Notification permission was not granted.');sv();R()})}
setInterval(()=>{if(!S.role||!S.prefs.remind||typeof Notification=='undefined'||Notification.permission!='granted')return;const d=new Date(),hm=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');if(hm==S.prefs.rtime&&S.remShown!=today()){S.remShown=today();new Notification('Your HeartQuest is waiting ❤️',{body:'A few small steps today make a big difference.'})}},30000);
function delData(){if(!confirm('Delete all your saved readings, meals, check-ins and profile numbers? This cannot be undone.'))return;S.V=[];S.food=[];S.checkins=[];S.P={hr:null,a1c:null,age:null,act:null,bmi:null,bp:null};S.bio={};S.trend=[];toast('Your saved health data was deleted.');R()}
function logoutC(){if(confirm('Log out of HeartQuest?'))logout()}
const FT={rice_cooked:['Rice, cooked','🍚',130,2.7,28,.3,1],dal:['Dal','🥣',116,7,17,2.5,230],chapati:['Chapati / roti','🫓',297,9,50,7,350],mixed_vegetables:['Mixed vegetables','🥦',65,2.5,10,2,70],chicken_curry:['Chicken curry','🍗',150,14,4,8,380],egg_boiled:['Egg, boiled','🥚',155,13,1.1,11,124],paneer_curry:['Paneer curry','🧀',265,12,6,21,300],fish_fried:['Fish, fried','🐟',190,18,6,10,350],idli:['Idli','⚪',130,4,26,.5,300],dosa:['Dosa','🥞',168,4,28,4.5,250],sambar:['Sambar','🍲',50,2.5,7,1.5,350],banana:['Banana','🍌',89,1.1,23,.3,1],apple:['Apple','🍎',52,.3,14,.2,1],salad:['Salad','🥗',25,1.2,4,.3,20],curd:['Curd / yogurt','🥛',60,3.5,5,3.3,46]};
let FM={items:[],img:null,ai:null,err:'',loading:false,aid:null,src:'Manual'};
const fcalc=i=>{const f=FT[i.k];return f&&i.g>0?{kcal:Math.round(f[2]*i.g/100),p:f[3]*i.g/100,c:f[4]*i.g/100,f:f[5]*i.g/100,na:f[6]*i.g/100}:null};
function ftot(){const r=FM.items.map(fcalc),ok=r.length>0&&r.every(Boolean),sum=k=>r.reduce((a,x)=>a+(x?x[k]:0),0);return{ok,unm:r.filter(x=>!x).length,kcal:Math.round(sum('kcal')),p:Math.round(sum('p')),c:Math.round(sum('c')),f:Math.round(sum('f')),na:Math.round(sum('na'))}}
function fph(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1024/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);FM.img=c.toDataURL('image/jpeg',.85);FM.ai=null;FM.aid=null;FM.err='';R()};im.onerror=()=>{FM.err='That file is not a readable image.';R()};im.src=r.result};r.readAsDataURL(f)}
async function anFood(){const m=needSrv();if(m){FM.err='Live AI analysis needs the HeartQuest server. '+m+' You can still add your meal by hand below. No sample results are shown.';return R()}
FM.loading=true;FM.err='';R();try{const j=await srv('/food/analyze',{method:'POST',body:{image:FM.img.split(',')[1],media_type:'image/jpeg'}});FM.ai=j;FM.aid=j.analysis_id;FM.src='AI estimate';FM.items=j.items.map(i=>({k:FT[i.key]?i.key:null,n:i.name,g:i.grams||100,conf:i.confidence}));if(!FM.items.length)FM.err='No food was detected. Retake the photo or add items by hand.'}catch(e){FM.err=netErr(e)}FM.loading=false;R()}
function fedit(x,k,v){FM.items[x][k]=k=='g'?Math.max(1,Math.min(1500,+v||1)):(v||null);if(k=='k'&&v)FM.items[x].n=FT[v][0];if(FM.aid)FM.src='AI estimate (edited)';R()}
function fadd(){const k=$('#fk').value;FM.items.push({k,n:FT[k][0],g:Math.max(10,+$('#fg').value||10)});R()}
function fsave(){const t=ftot();if(!FM.items.length)return toast('Add at least one food item first.');if(!t.ok)return toast('Choose a food for every item so calories can be worked out.');S.food.push({t:Date.now(),type:$('#fmt').value,kcal:t.kcal,mac:{p:t.p,c:t.c,f:t.f,na:t.na},src:FM.src,items:FM.items.map(i=>({n:FT[i.k][0],g:i.g}))});FM={items:[],img:null,ai:null,err:'',loading:false,aid:null,src:'Manual'};
 const q=S.Q.find(x=>x.id=='meal');if(q&&!q.d)done('meal');else{toast('Saved to meal history.');R()}}
function fheart(t){const pc=Math.round(t.na/20),tips=[];if(!FM.items.some(i=>['mixed_vegetables','salad','banana','apple'].includes(i.k)))tips.push('Add a portion of vegetables, salad or fruit.');if(t.na>800)tips.push('Cut back on added salt, pickles and sauces.');if(t.f>30)tips.push('Choose grilled, steamed or baked instead of fried.');if(!tips.length)tips.push('This looks like a balanced plate. Nice!');
 return`<div class="card" style="box-shadow:none"><b>Heart-health check</b><p>Sodium ≈ ${t.na} mg, about <b>${pc}%</b> of the 2,000 mg/day WHO guideline. ${pc<=25?'Lower-sodium meal 👍':pc<=40?'Moderate sodium.':'High sodium for a single meal.'}</p><ul>${tips.map(x=>'<li>'+x+'</li>').join('')}</ul><p class="mut">General suggestions, not personal medical advice.</p></div>`}
function food(){const td=today(),tm=S.food.filter(m=>new Date(m.t).toDateString()==td),t=ftot();
return`<h2 style="margin-bottom:8px">🍽 Scan Your Meal</h2><p class="mut">Calories and nutrients are estimates from reference values. Photos can't show hidden ingredients or exact portions.</p>
<div class="card"><h3>1. Add a photo</h3><input type="file" accept="image/*" capture="environment" onchange="fph(this)" aria-label="Take or choose a photo of your meal">${FM.img?`<div><img src="${FM.img}" alt="Your meal photo" style="max-width:100%;border-radius:14px;margin-top:8px"></div><div class="row" style="margin-top:8px"><button class="pri" onclick="anFood()" ${FM.loading?'disabled':''}>✨ Analyse with AI</button><button class="gh" onclick="FM.img=null;FM.ai=null;FM.aid=null;R()">Remove photo</button></div>`:'<p class="mut">Choose a photo to enable AI analysis, or add items by hand below.</p>'}${FM.loading?'<p role="status" class="beat">Analysing your meal…</p>':''}${FM.err?`<p role="alert" style="color:#b23b3b">${escB(FM.err)}</p>`:''}${FM.ai?`<p class="mut">AI analysis by ${escB(FM.ai.provider)}. Check each item and correct anything wrong. ${escB(FM.ai.notes||'')}</p>`:''}<p class="mut">Your photo is not stored.</p></div>
<div class="card"><h3>2. Review and correct</h3>${FM.items.map((i,x)=>`<div class="row" style="margin:6px 0"><span aria-hidden="true" style="font-size:26px">${FT[i.k]?FT[i.k][1]:'❓'}</span><select aria-label="Food" onchange="fedit(${x},'k',this.value)"><option value="">Not matched: choose…</option>${Object.entries(FT).map(([k,v])=>`<option value="${k}" ${k==i.k?'selected':''}>${v[0]}</option>`).join('')}</select><input type="number" aria-label="Grams" value="${i.g}" min="1" max="1500" style="width:90px;${ib}" onchange="fedit(${x},'g',this.value)"> g <b>${fcalc(i)?'≈ '+fcalc(i).kcal+' kcal':'unavailable'}</b>${i.conf!=null?`<span class="mut">${Math.round(i.conf*100)}% sure</span>`:''}<button class="gh" aria-label="Remove item" onclick="FM.items.splice(${x},1);R()">✕</button></div>`).join('')||'<p class="mut">No items yet.</p>'}
<div class="row"><select id="fk" aria-label="Add food">${Object.entries(FT).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('')}</select><input type="number" id="fg" value="150" min="10" max="1500" aria-label="Portion in grams" style="width:90px;${ib}"> g <button onclick="fadd()">Add item</button></div>
${FM.items.length?`<div class="card" style="box-shadow:none"><b>Estimated total: ${t.ok?t.kcal+' kcal':'incomplete'}</b>${t.ok?`<br>Protein ${t.p} g · Carbs ${t.c} g · Fat ${t.f} g · Sodium ${t.na} mg`:`<br><span class="mut">${t.unm} item(s) need a food choice.</span>`}<p class="mut">Estimate only. Portion size is the biggest source of error.</p></div>${t.ok?fheart(t):''}`:''}
<select id="fmt" aria-label="Meal type"><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Snack</option></select> <button class="pri" onclick="fsave()">💾 Save to Meal History</button></div>
<div class="card"><h3>Meal history today</h3>${tm.map(m=>`<div class="row sp"><span><b>${escB(m.type)}</b> <span class="pill">${escB(m.src||'Manual')}</span><br>${m.items.map(i=>escB(i.n)+' '+i.g+' g').join(', ')}${m.mac?'<br><span class="mut">P '+m.mac.p+' · C '+m.mac.c+' · F '+m.mac.f+' · Na '+m.mac.na+' mg</span>':''}</span><b>${m.kcal} kcal</b></div>`).join('')||'<p class="mut">No meals saved yet.</p>'}<p>Estimated total today: <b>${tm.reduce((a,m)=>a+m.kcal,0)} kcal</b></p></div>`}
R();

</script></body></html>
